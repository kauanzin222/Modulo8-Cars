<div class="pt-3 fs-5 ps-4">Cadastrar Carro:</div>

<form class="mt-3 pb-3 ps-5 pe-5" #formCar="ngForm">

    <!--Nome-->
    <div class="row pt-3">
        <div class="col-lg-2 pt-1">Nome:</div>
        <div class="col-lg-10">
            <input type="text" name="name" [(ngModel)]="car.name" id="nameInput" class="form-control" placeholder="Ex: Uno" required>
        </div>
    </div>

    <!--Montadora-->
    <div class="row pt-3">
        <div class="col-lg-2 pt-1">Montadora:</div>
        <div class="col-lg-10">
            <input type="text" name="brand" [(ngModel)]="car.brand" id="brandInput" class="form-control" placeholder="Ex: Fiat" required>
        </div>
    </div>

    <!--Preço & Ano-->
    <div class="row pt-3">
        <div class="col-lg-2 pt-1">Preço:</div>
        <div class="col-lg-4">
            <input type="number" name="price" [(ngModel)]="car.price" id="brandInput" class="form-control" placeholder="Ex: R$ 4.500,00" required>
        </div>
        <div class="col-lg-2 pt-1">Ano:</div>
        <div class="col-lg-4">
            <input type="number" name="yearMade" [(ngModel)]="car.yearMade" id="yearInput" class="form-control" placeholder="Ex: 2005" required>
        </div>
    </div>
    <button type="submit" class="btn btn-primary mt-3 mb-3"     (click)="save()" [disabled]="formCar.invalid">Salvar</button>
</form>
